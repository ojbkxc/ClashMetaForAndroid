# Server URL (primary, used for API calls)
v2board.server.url=https://jc.lxseek.com

# Backup domains (comma-separated, used if primary fails)
v2board.server.domains=https://jc.lxseek.com,https://go.lxkjzh.top,https://cdn.lxkjzh.top

# Subscription sync interval (minutes)
v2board.sync.interval=1440

# App display name
v2board.app.name=Blue Star Network
