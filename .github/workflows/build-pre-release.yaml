        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          V2BOARD_SERVER_URL: ${{ secrets.V2BOARD_SERVER_URL }}
          V2BOARD_SERVER_DOMAINS: ${{ secrets.V2BOARD_SERVER_DOMAINS }}
        run: |
          echo "=== Loading Environment Variables ==="
          echo "Priority: GitHub Secrets > .env file"
          
          # 如果 .env 文件存在，读取其中的变量（但不覆盖已有的 Secrets）
          if [ -f ".env" ]; then
            echo "Found .env file"
            while IFS='=' read -r key value; do
              # 跳过注释和空行
              if [[ $key == \#* || -z $key ]]; then
                continue
              fi
              # 如果变量未设置（Secrets 优先级更高），则从 .env 读取
              if [ -z "${!key}" ]; then
                export "$key=$value"
                echo "Loaded from .env: $key=$value"
              else
                echo "Secrets override .env: $key (using Secrets)"
              fi
            done < .env
          else
            echo "No .env file found, using Secrets only"
          fi

      - name: Generate V2Board config
        run: |
          if [ -n "$V2BOARD_SERVER_URL" ]; then
            cat > v2board.properties << EOF
v2board.server.url=$V2BOARD_SERVER_URL
v2board.server.domains=$V2BOARD_SERVER_DOMAINS
EOF
            echo "V2Board config generated"
          fi

      - name: Signing properties
        run: |
          if [ -n "$SIGNING_STORE_PASSWORD" ]; then
            touch signing.properties
            echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
            echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
            echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties
            echo "Signing properties created"
          else
            echo "No signing secrets configured, skipping"
          fi

      - name: Pre-release Build
        if: success()
        run: ./gradlew --no-daemon --stacktrace app:assembleAlphaRelease 2>&1

      - name: Check Build Output
        run: |
          APK_COUNT=$(ls app/build/outputs/apk/alpha/release/*.apk 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -gt 0 ]; then
            echo "✅ Build successful - Found $APK_COUNT APK(s)"
            ls -la app/build/outputs/apk/alpha/release/
          else
            echo "❌ Build failed - No APK found"
            echo "Checking for build errors..."
            find app/build -name "*.log" 2>/dev/null | head -5
            exit 1
          fi

      - name: Upload Alpha
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: Prerelease-alpha
          files: app/build/outputs/apk/alpha/release/*
          prerelease: true
          generate_release_notes: true
          overwrite: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Changelog Builder
        uses: mikepenz/release-changelog-builder-action@v4
        continue-on-error: true
