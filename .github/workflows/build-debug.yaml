name: Build Debug
on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if no changes'
        required: false
        default: 'false'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: |
          git submodule update --init --recursive --force
          cd core/src/foss/golang/clash
          git checkout Alpha

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
          cache: false

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - name: Tidy Go modules
        run: |
          cd $GITHUB_WORKSPACE/core/src/foss/golang
          go mod tidy
          cd $GITHUB_WORKSPACE/core/src/main/golang
          go mod tidy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Load Environment Variables
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          V2BOARD_SERVER_URL: ${{ secrets.V2BOARD_SERVER_URL }}
          V2BOARD_SERVER_DOMAINS: ${{ secrets.V2BOARD_SERVER_DOMAINS }}
        run: |
          echo "=== Loading Environment Variables ==="
          echo "Priority: GitHub Secrets > .env file"
          
          if [ -f ".env" ]; then
            echo "Found .env file"
            while IFS='=' read -r key value; do
              if [[ $key == \#* || -z $key ]]; then
                continue
              fi
              if [ -z "${!key}" ]; then
                export "$key=$value"
                echo "Loaded from .env: $key=$value"
              else
                echo "Secrets override .env: $key (using Secrets)"
              fi
            done < .env
          else
            echo "No .env file found, using Secrets only"
          fi

      - name: Generate V2Board config
        run: |
          if [ -n "$V2BOARD_SERVER_URL" ]; then
            cat > v2board.properties << EOF
v2board.server.url=$V2BOARD_SERVER_URL
v2board.server.domains=$V2BOARD_SERVER_DOMAINS
EOF
            echo "V2Board config generated"
          fi

      - name: Signing properties
        run: |
          if [ -n "$SIGNING_STORE_PASSWORD" ]; then
            touch signing.properties
            echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
            echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
            echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties
            echo "Signing properties created"
          else
            echo "No signing secrets configured, skipping"
          fi

      - name: Debug Build
        if: success()
        run: ./gradlew --no-daemon --stacktrace app:assembleDebug 2>&1

      - name: Upload Debug
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: Debug
          files: app/build/outputs/apk/debug/*
          prerelease: true
          generate_release_notes: true
          overwrite: true
          token: ${{ secrets.GITHUB_TOKEN }}
